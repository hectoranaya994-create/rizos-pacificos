<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Ventas · Rizos Pacíficos</title>
<style>
/* estilos.css — compartido por vendedor.html y admin.html */
:root{
  --pri:#5b2350;--pri2:#7a3a6c;--acc:#d9892b;--bg:#f5f2ef;--card:#fff;--txt:#2a2127;--mut:#7b7078;
  --line:#e7e0e4;--ok:#1f8a4c;--okbg:#e5f4ea;--warn:#b86e00;--warnbg:#fdf1dc;--bad:#c0392b;--badbg:#fbe5e2;
  --info:#2c6fb0;--infobg:#e3eefa;--pur:#6b3fa0;--purbg:#efe7f8;--r:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font:inherit;cursor:pointer}
a{color:inherit}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt);width:100%}
textarea{min-height:70px;resize:vertical}
header.top{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-weight:800;font-size:17px;flex:0 0 auto}
.brand h1{margin:0;font-size:16px}
.brand small{opacity:.8;font-size:12px}
.top .sp{flex:1}
.pill{background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.top .salir{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
nav#nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:6px 10px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav#nav button{border:0;background:none;padding:9px 13px;border-radius:8px;color:var(--mut);font-weight:600;white-space:nowrap}
nav#nav button.on{background:var(--pri);color:#fff}
.bdg{background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
.bdg:empty{display:none}
main{padding:16px;max-width:1280px;margin:0 auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.grow{flex:1 1 180px!important}
.between{justify-content:space-between}
h2{margin:4px 0 14px;font-size:20px}
h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.kpi .l{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:23px;font-weight:800;margin:4px 0 2px}
.kpi .s{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line);margin-bottom:12px;min-width:0}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;background:var(--pri);color:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn.sec{background:#efe8ed;color:var(--pri)}
.btn.acc{background:var(--acc)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.wa{background:#1fa855}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.blk{display:block;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#faf7f9;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#fbf6fa}
td.n,th.n{text-align:right}
.b{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.b.ok{background:var(--okbg);color:var(--ok)}.b.warn{background:var(--warnbg);color:var(--warn)}
.b.bad{background:var(--badbg);color:var(--bad)}.b.info{background:var(--infobg);color:var(--info)}
.b.pur{background:var(--purbg);color:var(--pur)}.b.mut{background:#eee;color:#666}
.mut{color:var(--mut)}
.small{font-size:12px}
.bars .br{display:flex;align-items:center;gap:8px;margin:6px 0}
.bars .br .lb{width:130px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .br .tr{flex:1;background:#f1ecef;border-radius:6px;height:18px;overflow:hidden}
.bars .br .fl{height:100%;background:var(--pri2);border-radius:6px}
.bars .br .vl{width:92px;text-align:right;font-size:12px;font-weight:600}
.vbars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.vbars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vbars .c .fl{width:100%;max-width:46px;background:var(--pri2);border-radius:6px 6px 0 0;min-height:2px}
.vbars .c.last .fl{background:var(--acc)}
.vbars .c .vl{font-size:10px;font-weight:700;margin-bottom:3px;white-space:nowrap}
.vbars .c .lb{font-size:10px;color:var(--mut);margin-top:4px;white-space:nowrap}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.list .it .x{flex:1;min-width:0}
.list .it .x b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#ede6ea;border-radius:var(--r);padding:10px;min-height:200px}
.col h3{display:flex;justify-content:space-between}
.pcard{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid var(--line)}
.pcard .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(30,15,25,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow-y:auto}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox.wide{max-width:920px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px}
.mhead h3{margin:0;font-size:17px}
.mhead button{border:0;background:#f1ecef;border-radius:8px;width:34px;height:34px;font-size:18px;flex:0 0 auto}
.mbody{padding:16px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fg label,label.f{font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding-top:14px;flex-wrap:wrap}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.big{font-size:18px;font-weight:800;border-top:2px solid var(--line);padding-top:8px;margin-top:4px}
.alert{padding:10px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert.info{background:var(--infobg);color:var(--info)}
.alert.ok{background:var(--okbg);color:var(--ok)}
.tabs2{display:flex;gap:6px;margin:12px 0 10px;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.tabs2 button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#2a2127;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;font-weight:600;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.login{max-width:380px;margin:40px auto;background:#fff;border-radius:16px;padding:24px;border:1px solid var(--line)}
.login h2{margin-top:0}
.login label{margin-bottom:12px}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block!important;font-size:12px;color:#000}
  #print table{font-size:12px}
  #print th,#print td{padding:5px 6px;white-space:normal}
}
@media(max-width:600px){
  main{padding:12px}
  .kpi .v{font-size:20px}
  .grid2{grid-template-columns:1fr}
  .bars .br .lb{width:90px}
  .hide-m{display:none!important}
}
/* Fotos de productos */
.ph{width:52px;height:52px;border-radius:10px;background:#f1ecef center/cover no-repeat;display:grid;place-items:center;font-size:24px;flex:0 0 auto;border:1px solid var(--line)}
.ph.sm{width:38px;height:38px;font-size:18px;border-radius:8px}
.ph.big{width:100%;max-width:340px;height:auto;aspect-ratio:1;margin:0 auto 12px;font-size:84px;border-radius:14px}
.ph.con{background-color:#fff}
.btnfile{position:relative;overflow:hidden}
.btnfile input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;padding:0}
</style>
<style>
main{max-width:760px;padding-bottom:96px}
header.top{flex-wrap:nowrap}
.brand{min-width:0}

.prod{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}

.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:8px;border:0;background:#efe8ed;color:var(--pri);font-size:18px;font-weight:700}
.qty input{width:48px;text-align:center;padding:6px 2px}
.cartbar{position:fixed;left:0;right:0;bottom:62px;z-index:19;padding:0 12px 8px;pointer-events:none}
.cartbar>div{max-width:736px;margin:0 auto;background:var(--pri);color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:auto}
.cartbar b{font-size:16px}
.ped{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.sec-t{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px}
</style>

<body>
<header class="top">
  <div class="logo">RP</div>
  <div class="brand"><h1 id="hdNom">Ventas</h1><small id="hdSub">Rizos Pacíficos</small></div>
  <div class="sp"></div>
  <span class="pill" id="conexion"></span>
  <button class="salir" id="btnSalir" onclick="salir()" style="display:none">Salir</button>
</header>
<main id="app"></main>
<div class="cartbar" id="cartbar" style="display:none"></div>
<nav class="bnav" id="bnav" style="display:none">
  <button data-v="inicio" onclick="go('inicio')"><span class="ic">🏠</span>Hoy</button>
  <button data-v="clientes" onclick="go('clientes')"><span class="ic">🏪</span>Clientes</button>
  <button data-v="pedido" class="mas" onclick="go('pedido')"><span class="ic">＋</span>Pedido</button>
  <button data-v="mis" onclick="go('mis')"><span class="ic">🧾</span>Mis pedidos<span class="bdg" id="bdgMis"></span></button>
  <button data-v="auto" onclick="go('auto')"><span class="ic">📊</span>Autogestión</button>
</nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="mbox" id="mbox"><div class="mhead"><h3 id="mTitle"></h3><button onclick="closeModal()">×</button></div><div class="mbody" id="mBody"></div></div>
</div>
<div id="toast"></div>
<script>
/* =====================================================================
   nucleo.js — compartido por vendedor.html y admin.html
   Datos, sincronización (local o Firebase), cola offline y reglas de negocio.
   ===================================================================== */

/* ---------- CONFIGURACIÓN ---------- */
let EMPRESA = 'Rizos Pacíficos';   // se reemplaza con config/empresa (Equipo y ajustes › Empresa)
function inicialesDe(n) { return String(n || '').trim().split(/\s+/).filter(w => w.length > 2 || /^[A-ZÁÉÍÓÚ]/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'RP'; }
function aplicarMarca(e) {
  e = e || (typeof DB !== 'undefined' && DB.config && DB.config.empresa) || {};
  const nombre = (e.nombre || '').trim() || 'Rizos Pacíficos';
  if (!window._T0) window._T0 = document.title;
  EMPRESA = nombre; document.title = window._T0.replace('Rizos Pacíficos', nombre);
  document.querySelectorAll('.logo').forEach(x => {
    if (e.logo) { x.textContent = ''; x.style.background = `#fff url("${e.logo}") center/cover no-repeat`; }
    else { x.style.background = ''; x.textContent = (e.iniciales || '').trim().toUpperCase().slice(0, 3) || inicialesDe(nombre); }
  });
  document.querySelectorAll('[data-marca]').forEach(x => x.textContent = nombre);
  document.querySelectorAll('[data-lema]').forEach(x => x.textContent = (e.lema || '').trim() || 'Distribuidora capilar · Canal TAT Chocó');
}

// MODO: si FIREBASE_CONFIG es null el sistema corre en MODO DEMO LOCAL:
// los datos viven en este navegador y el vendedor y el admin se comunican
// solo entre pestañas del mismo navegador (sirve para presentar el demo).
// Para operar de verdad (celular del vendedor ↔ PC de oficina) reemplaza
// null por el objeto de configuración de tu proyecto Firebase, por ejemplo:
// const FIREBASE_CONFIG = { apiKey:"...", authDomain:"...", databaseURL:"https://....firebaseio.com", projectId:"...", appId:"..." };
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBz0NhQzMzup8oFdQZr9sWYZIJIp1s8ZjY",
  authDomain: "distri-elena.firebaseapp.com",
  databaseURL: "https://distri-elena-default-rtdb.firebaseio.com",
  projectId: "distri-elena",
  storageBucket: "distri-elena.firebasestorage.app",
  messagingSenderId: "266793024970",
  appId: "1:266793024970:web:09bbc82d5ba6cf10156333"
};
// DEMO = true → nodo y memoria local separados, se llena con datos de prueba. DEMO = false → producción.
const DEMO = false;
const RAIZ = DEMO ? 'distcap' : 'rizos';   // nodo raíz: 'distcap' = datos de prueba, 'rizos' = operación real
const PFX = DEMO ? 'rp_demo_' : 'rp_';            // prefijo de memoria local (no mezclar demo y producción)
if (DEMO) { document.title = '[DEMO] ' + document.title; document.addEventListener('DOMContentLoaded', () => document.body.insertAdjacentHTML('afterbegin', '<div style="background:#d9892b;color:#fff;text-align:center;font-weight:700;font-size:12px;padding:4px">MODO DEMO · datos de prueba, no es la operación real</div>')); }
const FB_VER = '10.12.2';

const MEDIOS_PAGO = ['Efectivo', 'Nequi', 'Daviplata', 'Transferencia'];
const TIPOS_CLIENTE = ['Tienda', 'Peluquería', 'Salón de belleza', 'Droguería', 'Minimercado', 'Miscelánea'];
const MUNICIPIOS = ['Quibdó', 'Istmina', 'Tadó', 'Condoto', 'Unión Panamericana', 'Atrato'];
const ETAPAS = ['Prospecto', 'Contactado', 'Muestra entregada', 'Negociación'];
const TIPOS_CONTACTO = ['Visita', 'Llamada', 'WhatsApp'];
const ESTADOS = {
  por_aprobar: ['warn', 'Por aprobar'],
  facturado: ['pur', 'Facturado'],
  despachado: ['info', 'En ruta'],
  entregado: ['ok', 'Entregado'],
  rechazado: ['bad', 'Rechazado'],
  anulado: ['mut', 'Anulado']
};
const VALIDOS = ['facturado', 'despachado', 'entregado'];   // cuentan como venta

/* ---------- UTILIDADES ---------- */
const fmt = n => '$' + Math.round(n || 0).toLocaleString('es-CO');
const fmtK = n => n >= 1e6 ? '$' + (n / 1e6).toFixed(1).replace('.', ',') + 'M' : '$' + Math.round(n / 1000) + 'k';
const pad = (n, l = 3) => String(n).padStart(l, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2);
const TODAY = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const diasEntre = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const hace = d => d === 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días';
const fFecha = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y.slice(2); };
const fHora = ts => ts ? new Date(ts).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
const vals = o => o ? Object.values(o) : [];
const $ = id => document.getElementById(id);
const uid = pre => pre + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase().padStart(2, '0');
function toast(t) { const e = $('toast'); if (!e) return; e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2600); }
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .08; o.start(); o.stop(a.currentTime + .18); setTimeout(() => { const o2 = a.createOscillator(); o2.connect(g); o2.frequency.value = 1175; o2.start(); o2.stop(a.currentTime + .18); }, 200); } catch (e) {} }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------- CAPA DE DATOS ---------- */
// DB es una copia en memoria de todo el nodo RAIZ. Toda escritura pasa por guardar():
// se aplica en memoria, se guarda en caché local y (en modo Firebase) entra a una cola
// que se envía cuando hay conexión. Si el celular se queda sin señal o se cierra la app,
// la cola sobrevive y se sube al volver la conexión.
const LS_DB = PFX + 'db', LS_Q = PFX + 'cola';
const MODO = FIREBASE_CONFIG ? 'firebase' : 'local';
let DB = {}, fbRoot = null, CONECTADO = MODO === 'local', onDatos = () => {};

function setPath(obj, path, val) {
  const ps = path.split('/'); let o = obj;
  for (let i = 0; i < ps.length - 1; i++) { if (o[ps[i]] == null || typeof o[ps[i]] !== 'object') o[ps[i]] = {}; o = o[ps[i]]; }
  const k = ps[ps.length - 1];
  if (val === null || val === undefined) delete o[k]; else o[k] = JSON.parse(JSON.stringify(val));
}
const cola = () => lsGet(LS_Q, []);
function cachear() { lsSet(LS_DB, DB); }

function guardar(upd) {
  upd = JSON.parse(JSON.stringify(upd, (k, v) => v === undefined ? null : v));
  for (const p in upd) setPath(DB, p, upd[p]);
  cachear();
  if (MODO === 'firebase') { const q = cola(); q.push(upd); lsSet(LS_Q, q); vaciarCola(); }
  pintarConexion();
}
let vaciando = false;
async function vaciarCola() {
  if (vaciando || !fbRoot || !CONECTADO) return;
  vaciando = true;
  try {
    while (cola().length) {
      await fbRoot.update(cola()[0]);
      const q = cola(); q.shift(); lsSet(LS_Q, q); pintarConexion();
    }
  } catch (e) { console.warn('Sync', e); }
  vaciando = false; pintarConexion();
}
// Consecutivos (factura, compra…). En Firebase usa transacción: requiere conexión.
async function siguiente(nombre) {
  if (MODO === 'local') { const n = ((DB.seq || {})[nombre] || 0) + 1; guardar({ ['seq/' + nombre]: n }); return n; }
  if (!fbRoot || !CONECTADO) throw new Error('Se necesita conexión a internet para generar el consecutivo');
  const r = await fbRoot.child('seq/' + nombre).transaction(v => (v || 0) + 1);
  if (!r.committed) throw new Error('No se pudo generar el consecutivo');
  return r.snapshot.val();
}
async function reemplazarTodo(data) {
  if (MODO === 'firebase') {
    if (!fbRoot || !CONECTADO) throw new Error('Se necesita conexión');
    lsSet(LS_Q, []); await fbRoot.set(data);
  }
  DB = JSON.parse(JSON.stringify(data)); cachear(); onDatos('reset');
}
function cargarScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
let fbIniciando = false;
async function conectarFirebase() {
  if (fbRoot || fbIniciando) return; fbIniciando = true;
  try {
    await cargarScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await cargarScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database-compat.js`);
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database(); fbRoot = db.ref(RAIZ);
    db.ref('.info/connected').on('value', s => { CONECTADO = !!s.val(); pintarConexion(); if (CONECTADO) vaciarCola(); });
    // Primera vez: si el nodo no tiene config, se carga la demo para poder entrar.
    const cfg = await fbRoot.child('config').once('value');
    if (!cfg.exists()) { await fbRoot.update(DEMO ? seed() : datosVacios()); toast(DEMO ? 'Demo inicializado con datos de prueba' : 'Base nueva creada: entra con admin / admin123 y cambia la clave'); }
    // Se escucha cada sección por separado para NO descargar el nodo "fotos" completo:
    // las fotos se bajan una por una cuando se necesitan y quedan guardadas en el equipo.
    NODOS.forEach(k => fbRoot.child(k).on('value', s => {
      const v = s.val(); if (v == null) delete DB[k]; else DB[k] = v;
      cola().forEach(u => { for (const p in u) if (p.split('/')[0] === k) setPath(DB, p, u[p]); });   // lo pendiente por subir sigue visible
      cachear(); onDatos('remoto');
    }));
  } catch (e) { toast('Sin conexión: trabajando con los datos guardados en este equipo'); }
  fbIniciando = false;
}
function iniciarDatos(cb) {
  onDatos = (...a) => { aplicarMarca(); cb(...a); };
  DB = lsGet(LS_DB, null);
  if (MODO === 'local') {
    if (!DB || !DB.config) { DB = seed(); cachear(); }
    window.addEventListener('storage', e => { if (e.key === LS_DB && e.newValue) { DB = JSON.parse(e.newValue); onDatos('remoto'); } });
    onDatos('inicial'); pintarConexion(); return;
  }
  DB = DB || {};
  onDatos('cache'); pintarConexion();
  conectarFirebase();
  window.addEventListener('online', () => { conectarFirebase(); vaciarCola(); });
}
function pintarConexion() {
  const e = $('conexion'); if (!e) return;
  const n = MODO === 'firebase' ? cola().length : 0;
  if (MODO === 'local') { e.textContent = '🟣 Demo local'; e.title = 'Datos guardados solo en este navegador'; return; }
  e.textContent = !CONECTADO ? `🔴 Sin conexión${n ? ' · ' + n + ' por subir' : ''}` : n ? `🟡 Subiendo ${n}…` : '🟢 En línea';
  e.title = n ? 'Hay cambios guardados en este equipo esperando conexión' : '';
}

/* ---------- FOTOS DE PRODUCTOS ---------- */
// La foto se comprime en el celular (~480 px, 20-40 KB) y se guarda en fotos/{pid}.
// productos/{pid}/foto guarda solo la versión (fecha): así cada equipo sabe si la que tiene está vieja.
// Cada foto se descarga una sola vez y queda en IndexedDB para verla sin señal.
const NODOS = ['config', 'vendedores', 'productos', 'clientes', 'pedidos', 'notas', 'prospectos', 'compras', 'seq', 'visitas', 'liquidaciones'];
const ICONO_CAT = { 'Cremas para peinar': '🧴', 'Shampoo y acondicionador': '🫧', 'Tratamientos': '💆', 'Geles y activadores': '🫙', 'Aceites y mantecas': '🥥', 'Coloración': '🎨', 'Accesorios': '🪮' };
const FOTOS = {};
const idb = (() => {
  let p = null;
  const abrir = () => p || (p = new Promise((ok, no) => { const r = indexedDB.open(PFX + 'fotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }));
  return {
    get: k => abrir().then(d => new Promise(ok => { const t = d.transaction('f').objectStore('f').get(k); t.onsuccess = () => ok(t.result || null); t.onerror = () => ok(null); })).catch(() => null),
    set: (k, v) => abrir().then(d => new Promise(ok => { const t = d.transaction('f', 'readwrite'); t.objectStore('f').put(v, k); t.oncomplete = () => ok(true); t.onerror = () => ok(false); })).catch(() => false)
  };
})();
async function comprimirImagen(file, max = 480, q = 0.72) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('No se pudo leer la imagen')); i.src = url; });
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
async function subirFoto(pid, file, por) {
  if (!file) return;
  if (!/^image\//.test(file.type)) throw new Error('El archivo no es una imagen');
  const data = await comprimirImagen(file), ver = Date.now();
  if (MODO === 'firebase') {
    if (!fbRoot || !CONECTADO) throw new Error('Necesitas señal para subir la foto');
    await fbRoot.child('fotos/' + pid).set(data);
  }
  await idb.set(pid + '@' + ver, data); FOTOS[pid + '@' + ver] = data;
  guardar({ [`productos/${pid}/foto`]: ver, [`productos/${pid}/fotoPor`]: por || '' });
}
function quitarFoto(pid) {
  const upd = { [`productos/${pid}/foto`]: null, [`productos/${pid}/fotoPor`]: null };
  if (MODO === 'firebase') upd['fotos/' + pid] = null;
  guardar(upd); delete DB.fotos;
}
async function fotoSrc(p) {
  if (!p || !p.foto) return null;
  const k = p.id + '@' + p.foto;
  if (FOTOS[k]) return FOTOS[k];
  let d = await idb.get(k);
  if (!d && MODO === 'firebase' && fbRoot) { try { d = (await fbRoot.child('fotos/' + p.id).once('value')).val(); if (d) idb.set(k, d); } catch (e) {} }
  if (d) FOTOS[k] = d;
  return d;
}
// Miniatura: muestra el ícono de la categoría hasta que carga la foto.
const htmlFoto = (p, cls) => `<div class="ph ${cls || ''}" data-foto="${p.id}" data-v="${p.foto || ''}">${ICONO_CAT[p.cat] || '📦'}</div>`;
function pintarFotos() {
  document.querySelectorAll('[data-foto]:not([data-ok])').forEach(async el => {
    el.setAttribute('data-ok', '1');
    const src = await fotoSrc(P(el.dataset.foto));
    if (src && el.isConnected) { el.style.backgroundImage = `url("${src}")`; el.textContent = ''; el.classList.add('con'); }
  });
}
let _pf = 0;
new MutationObserver(() => { cancelAnimationFrame(_pf); _pf = requestAnimationFrame(pintarFotos); }).observe(document.documentElement, { childList: true, subtree: true });

function distanciaM(a, b) {
  if (!a || !b) return null;
  const R = 6371000, t = x => x * Math.PI / 180, dLa = t(b.lat - a.lat), dLo = t(b.lng - a.lng);

}

/* ---------- METAS Y COMISIONES ---------- */
// Venta = facturado del mes. Recaudo = abonos confirmados del mes + pedidos de contado facturados del mes.
// La comisión se calcula sobre la base configurada por vendedor (recomendado: recaudo).
function comisionVendedor(vid, mes) {
  mes = mes || TODAY().slice(0, 7);
  const v = V(vid), ps = pedidos().filter(o => o.vendedorId === vid);
  const venta = sum(ps.filter(o => VALIDOS.includes(o.estado) && o.fecha.startsWith(mes)), o => o.total);
  const recCred = sum(ps.flatMap(o => o.estado === 'anulado' ? [] : abonos(o).filter(a => a.confirmado && a.fecha.startsWith(mes))), a => a.valor);
  const recCont = sum(ps.filter(o => o.pago === 'contado' && VALIDOS.includes(o.estado) && o.fecha.startsWith(mes)), o => o.total);
  const recaudo = recCred + recCont, pct = +v.comPct || 0, base = v.comBase === 'venta' ? venta : recaudo;
  const meta = +v.metaMes || 0;
  const [y, m] = mes.split('-').map(Number), diasMes = new Date(y, m, 0).getDate();
  const diaHoy = mes === TODAY().slice(0, 7) ? +TODAY().slice(8) : diasMes;
  return { venta, recaudo, base, baseTxt: v.comBase === 'venta' ? 'venta facturada' : 'recaudo', pct, comision: Math.round(base * pct / 100), meta, avance: meta ? venta / meta * 100 : 0, esperado: meta ? diaHoy / diasMes * 100 : 0, proyeccion: diaHoy ? venta / diaHoy * diasMes : 0 };
}

/* ---------- VISITAS DE RUTA (check-in con GPS) ---------- */
let CHK = null;   // último check-in: { cid, gps, ts }
function llegue(cid) {
  const c = C(cid);
  CHK = { cid, gps: null, ts: Date.now(), leyendo: true };
  openModal('Visita · ' + c.nombre, `
    <div id="gpsEst" class="alert info">📍 Obteniendo tu ubicación…</div>
    <div class="small mut" style="margin-bottom:10px">${esc(c.barrio)}, ${esc(c.municipio)} · ${c.plazo ? 'crédito' : 'contado'}${saldoCliente(cid) ? ' · saldo ' + fmt(saldoCliente(cid)) : ''}</div>
    <div style="display:grid;gap:8px">
      <button class="btn blk" onclick="closeModal();iniciarPedido('${cid}')">🛒 Tomar pedido</button>
      <button class="btn sec blk" onclick="$('noCompro').style.display='block'">🙅 No compró</button>
      <div id="noCompro" style="display:none" class="card"><label class="f">Motivo<select id="viMot">${MOTIVOS_NO.map(m => `<option>${m}</option>`).join('')}</select></label><button class="btn ok blk" style="margin-top:8px" onclick="guardarVisita('${cid}','no_compro',$('viMot').value)">Guardar visita</button></div>
      <button class="btn sec blk" onclick="guardarVisita('${cid}','cerrado')">🔒 Estaba cerrado</button>
      ${saldoCliente(cid) ? `<button class="btn sec blk" onclick="guardarVisita('${cid}','cobro');formRecaudo('${cid}')">💵 Solo vine a cobrar</button>` : ''}
    </div>`);
  ubicacion().then(g => {
    if (!CHK || CHK.cid !== cid) return;
    CHK.gps = g; CHK.leyendo = false;
    const el = $('gpsEst'); if (!el) return;
    if (!g) { el.className = 'alert warn'; el.textContent = '⚠️ Sin ubicación (GPS apagado o sin permiso). La visita se guarda igual.'; return; }
    const d = distanciaM(g, c.gps);
    if (!c.gps) { el.className = 'alert ok'; el.textContent = `📍 Ubicación tomada (±${g.acc} m). Quedará como la ubicación de este negocio.`; }
    else if (d > DIST_ALERTA) { el.className = 'alert warn'; el.textContent = `⚠️ Estás a ${fDist(d)} del negocio registrado.`; }
    else { el.className = 'alert ok'; el.textContent = `✅ En el negocio (a ${fDist(d)}, ±${g.acc} m)`; }
  });
}
function guardarVisita(cid, resultado, motivo, pedidoId) {
  const c = C(cid), id = uid('VI');
  const gps = CHK && CHK.cid === cid && Date.now() - CHK.ts < 2 * 3600000 ? CHK.gps : null;
  const upd = { ['visitas/' + id]: { id, fecha: TODAY(), ts: Date.now(), clienteId: cid, vendedorId: VID, resultado, motivo: motivo || '', pedidoId: pedidoId || '', gps, dist: gps && c.gps ? Math.round(distanciaM(gps, c.gps)) : null } };
  if (gps && !c.gps) upd[`clientes/${cid}/gps`] = gps;
  guardar(upd);
  if (!gps) ubicacion(6000).then(g => { if (g) { const u = { [`visitas/${id}/gps`]: g, [`visitas/${id}/dist`]: C(cid).gps ? Math.round(distanciaM(g, C(cid).gps)) : null }; if (!C(cid).gps) u[`clientes/${cid}/gps`] = g; guardar(u); } });

}

function vProspectos() {
  const ps = vals(DB.prospectos).filter(p => p.vendedorId === VID);
  $('app').innerHTML = `<div class="row between"><h2>Mis prospectos</h2><button class="btn sm" onclick="formProspecto()">+ Nuevo</button></div>
  <p class="small mut" style="margin-top:-8px">Negocios que aún no compran. Avánzalos hasta cerrar el primer pedido.</p>
  ${ETAPAS.map((et, i) => { const l = ps.filter(p => p.etapa === i); return `<div class="sec-t">${et} (${l.length})</div>${l.map(p => `<div class="pcard"><b>${esc(p.nombre)}</b><div class="small mut">${esc(p.contacto)} · ${esc(p.municipio)}</div>${p.nota ? `<div class="small" style="margin-top:4px">${esc(p.nota)}</div>` : ''}
    <div class="acts">${i > 0 ? `<button class="btn sm sec" onclick="moverPr('${p.id}',-1)">◀</button>` : ''}${i < 3 ? `<button class="btn sm sec" onclick="moverPr('${p.id}',1)">Avanzar ▶</button>` : ''}<button class="btn sm ok" onclick="convertirPr('${p.id}')">Ya compra → cliente</button><a class="btn sm wa" target="_blank" href="${waLink(p.tel, `Hola ${p.contacto.split(' ')[0]}, le saluda ${yo().nombre} de ${EMPRESA}. Distribuimos productos para cabello rizado y afro a precio mayorista con entrega en ${p.municipio}. ¿Le comparto la lista de precios?`)}">WA</a></div></div>`).join('') || '<p class="small mut">—</p>'}`; }).join('')}`;
}
function moverPr(id, d) { const p = DB.prospectos[id]; guardar({ [`prospectos/${id}/etapa`]: Math.max(0, Math.min(3, p.etapa + d)) }); render(); }
function convertirPr(id) { formCliente(DB.prospectos[id]); }
function formProspecto() {
  openModal('Nuevo prospecto', `
    <div class="fg">
      <label>Nombre del negocio<input id="fpNom"></label>
      <label>Tipo<select id="fpTipo">${TIPOS_CLIENTE.map(t => `<option>${t}</option>`).join('')}</select></label>
      <label>Contacto<input id="fpCon"></label>
      <label>Celular<input id="fpTel" inputmode="numeric"></label>
      <label>Municipio<select id="fpMun">${MUNICIPIOS.map(m => `<option>${m}</option>`).join('')}</select></label>
    </div>
    <label class="f" style="margin-top:10px">Nota<textarea id="fpNota" placeholder="Qué le interesa, cómo llegó…"></textarea></label>
    <div class="mfoot"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" onclick="guardarPr()">Guardar</button></div>`);
}
function guardarPr() {
  const nombre = $('fpNom').value.trim(); if (!nombre) return toast('Escribe el nombre del negocio');
  const id = uid('PR');
  guardar({ ['prospectos/' + id]: { id, nombre, tipo: $('fpTipo').value, contacto: $('fpCon').value.trim() || '—', tel: $('fpTel').value.replace(/\D/g, ''), municipio: $('fpMun').value, etapa: 0, nota: $('fpNota').value.trim(), vendedorId: VID, fecha: TODAY() } });
  closeModal(); render(); toast('Prospecto agregado');
}
</script>
</body>
</html>
