<style>

<script>
/* =====================================================================
   nucleo.js — compartido por vendedor.html y admin.html
   Datos, sincronización (local o Firebase), cola offline y reglas de negocio.
   ===================================================================== */

/* ---------- CONFIGURACIÓN ---------- */
let EMPRESA = 'Rizos Pacíficos';   // se reemplaza con config/empresa (Equipo y ajustes › Empresa)
function inicialesDe(n) { n = String(n || '').trim(); const cam = n.match(/[A-ZÁÉÍÓÚÑ]/g); if (!/\s/.test(n) && cam && cam.length > 1) return cam.slice(0, 2).join(''); return n.split(/\s+/).filter(w => w.length > 2 || /^[A-ZÁÉÍÓÚ]/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'RP'; }
function aplicarMarca(e) {
  e = e || (typeof DB !== 'undefined' && DB.config && DB.config.empresa) || {};
  const nombre = (e.nombre || '').trim() || 'Rizos Pacíficos';
  if (!window._T0) window._T0 = document.title;
  EMPRESA = nombre; document.title = window._T0.replace('Rizos Pacíficos', nombre);
  document.querySelectorAll('.logo').forEach(x => {
    if (e.logo) { x.textContent = ''; x.style.background = `#fff url("${e.logo}") center/cover no-repeat`; }
    else { x.style.background = ''; x.textContent = (e.iniciales || '').trim().toUpperCase().slice(0, 3) || inicialesDe(nombre); }
  });
  document.querySelectorAll('[data-marca]').forEach(x => x.textContent = nombre);
  document.querySelectorAll('[data-lema]').forEach(x => x.textContent = (e.lema || '').trim() || 'Distribuidora capilar · Canal TAT Chocó');
}

// MODO: si FIREBASE_CONFIG es null el sistema corre en MODO DEMO LOCAL:
// los datos viven en este navegador y el vendedor y el admin se comunican
// solo entre pestañas del mismo navegador (sirve para presentar el demo).
// Para operar de verdad (celular del vendedor ↔ PC de oficina) reemplaza
// null por el objeto de configuración de tu proyecto Firebase, por ejemplo:
// const FIREBASE_CONFIG = { apiKey:"...", authDomain:"...", databaseURL:"https://....firebaseio.com", projectId:"...", appId:"..." };
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBz0NhQzMzup8oFdQZr9sWYZIJIp1s8ZjY",
  authDomain: "distri-elena.firebaseapp.com",
  databaseURL: "https://distri-elena-default-rtdb.firebaseio.com",
  projectId: "distri-elena",
  storageBucket: "distri-elena.firebasestorage.app",
  messagingSenderId: "266793024970",
  appId: "1:266793024970:web:09bbc82d5ba6cf10156333"
};
// DEMO = true → nodo y memoria local separados, se llena con datos de prueba. DEMO = false → producción.
const DEMO = false;
const RAIZ = DEMO ? 'distcap' : 'rizos';   // nodo raíz: 'distcap' = datos de prueba, 'rizos' = operación real
const PFX = DEMO ? 'rp_demo_' : 'rp_';            // prefijo de memoria local (no mezclar demo y producción)
if (DEMO) { document.title = '[DEMO] ' + document.title; document.addEventListener('DOMContentLoaded', () => document.body.insertAdjacentHTML('afterbegin', '<div style="background:#d9892b;color:#fff;text-align:center;font-weight:700;font-size:12px;padding:4px">MODO DEMO · datos de prueba, no es la operación real</div>')); }
const FB_VER = '10.12.2';

const MEDIOS_PAGO = ['Efectivo', 'Nequi', 'Daviplata', 'Transferencia'];
const TIPOS_CLIENTE = ['Tienda', 'Peluquería', 'Salón de belleza', 'Droguería', 'Minimercado', 'Miscelánea'];
const MUNICIPIOS = ['Quibdó', 'Istmina', 'Tadó', 'Condoto', 'Unión Panamericana', 'Atrato'];
const ETAPAS = ['Prospecto', 'Contactado', 'Muestra entregada', 'Negociación'];
const TIPOS_CONTACTO = ['Visita', 'Llamada', 'WhatsApp'];
const ESTADOS = {
  por_aprobar: ['warn', 'Por aprobar'],
  facturado: ['pur', 'Facturado'],
  despachado: ['info', 'En ruta'],
  entregado: ['ok', 'Entregado'],
  rechazado: ['bad', 'Rechazado'],
  anulado: ['mut', 'Anulado']
};
const VALIDOS = ['facturado', 'despachado', 'entregado'];   // cuentan como venta

/* ---------- UTILIDADES ---------- */
const fmt = n => '$' + Math.round(n || 0).toLocaleString('es-CO');
const fmtK = n => n >= 1e6 ? '$' + (n / 1e6).toFixed(1).replace('.', ',') + 'M' : '$' + Math.round(n / 1000) + 'k';
const pad = (n, l = 3) => String(n).padStart(l, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2);
const TODAY = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const diasEntre = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const hace = d => d === 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días';
const fFecha = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y.slice(2); };
const fHora = ts => ts ? new Date(ts).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
const vals = o => o ? Object.values(o) : [];
const $ = id => document.getElementById(id);
const uid = pre => pre + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase().padStart(2, '0');
function toast(t) { const e = $('toast'); if (!e) return; e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2600); }
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .08; o.start(); o.stop(a.currentTime + .18); setTimeout(() => { const o2 = a.createOscillator(); o2.connect(g); o2.frequency.value = 1175; o2.start(); o2.stop(a.currentTime + .18); }, 200); } catch (e) {} }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------- CAPA DE DATOS ---------- */
// DB es una copia en memoria de todo el nodo RAIZ. Toda escritura pasa por guardar():
// se aplica en memoria, se guarda en caché local y (en modo Firebase) entra a una cola
// que se envía cuando hay conexión. Si el celular se queda sin señal o se cierra la app,
// la cola sobrevive y se sube al volver la conexión.
const LS_DB = PFX + 'db', LS_Q = PFX + 'cola';
const MODO = FIREBASE_CONFIG ? 'firebase' : 'local';
let DB = {}, fbRoot = null, CONECTADO = MODO === 'local', onDatos = () => {};

function setPath(obj, path, val) {
  const ps = path.split('/'); let o = obj;
  for (let i = 0; i < ps.length - 1; i++) { if (o[ps[i]] == null || typeof o[ps[i]] !== 'object') o[ps[i]] = {}; o = o[ps[i]]; }
  const k = ps[ps.length - 1];
  if (val === null || val === undefined) delete o[k]; else o[k] = JSON.parse(JSON.stringify(val));
}
const cola = () => lsGet(LS_Q, []);
function cachear() { lsSet(LS_DB, DB); }

function guardar(upd) {
  upd = JSON.parse(JSON.stringify(upd, (k, v) => v === undefined ? null : v));
  for (const p in upd) setPath(DB, p, upd[p]);
  cachear();
  if (MODO === 'firebase') { const q = cola(); q.push(upd); lsSet(LS_Q, q); vaciarCola(); }
  pintarConexion();
}
let vaciando = false;
async function vaciarCola() {
  if (vaciando || !fbRoot || !CONECTADO) return;
  vaciando = true;
  try {
    while (cola().length) {
      await fbRoot.update(cola()[0]);
      const q = cola(); q.shift(); lsSet(LS_Q, q); pintarConexion();
    }
  } catch (e) { console.warn('Sync', e); }
  vaciando = false; pintarConexion();
}
// Consecutivos (factura, compra…). En Firebase usa transacción: requiere conexión.
async function siguiente(nombre) {
  if (MODO === 'local') { const n = ((DB.seq || {})[nombre] || 0) + 1; guardar({ ['seq/' + nombre]: n }); return n; }
  if (!fbRoot || !CONECTADO) throw new Error('Se necesita conexión a internet para generar el consecutivo');
  const r = await fbRoot.child('seq/' + nombre).transaction(v => (v || 0) + 1);
  if (!r.committed) throw new Error('No se pudo generar el consecutivo');
  return r.snapshot.val();
}
async function reemplazarTodo(data) {
  if (MODO === 'firebase') {
    if (!fbRoot || !CONECTADO) throw new Error('Se necesita conexión');

const FOTOS = {};
const idb = (() => {
  let p = null;
  const abrir = () => p || (p = new Promise((ok, no) => { const r = indexedDB.open(PFX + 'fotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }));
  return {
    get: k => abrir().then(d => new Promise(ok => { const t = d.transaction('f').objectStore('f').get(k); t.onsuccess = () => ok(t.result || null); t.onerror = () => ok(null); })).catch(() => null),

async function comprimirImagen(file, max = 480, q = 0.72) {

    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);

}

/* ---------- METAS Y COMISIONES ---------- */
// Venta = facturado del mes. Recaudo = abonos confirmados del mes + pedidos de contado facturados del mes.
// La comisión se calcula sobre la base configurada por vendedor (recomendado: recaudo).
function comisionVendedor(vid, mes) {
  mes = mes || TODAY().slice(0, 7);
  const v = V(vid), ps = pedidos().filter(o => o.vendedorId === vid);
  const venta = sum(ps.filter(o => VALIDOS.includes(o.estado) && o.fecha.startsWith(mes)), o => o.total);
  const recCred = sum(ps.flatMap(o => o.estado === 'anulado' ? [] : abonos(o).filter(a => a.confirmado && a.fecha.startsWith(mes))), a => a.valor);
  const recCont = sum(ps.filter(o => o.pago === 'contado' && VALIDOS.includes(o.estado) && o.fecha.startsWith(mes)), o => o.total);
  const recaudo = recCred + recCont, pct = +v.comPct || 0, base = v.comBase === 'venta' ? venta : recaudo;
  const meta = +v.metaMes || 0;
  const [y, m] = mes.split('-').map(Number), diasMes = new Date(y, m, 0).getDate();
  const diaHoy = mes === TODAY().slice(0, 7) ? +TODAY().slice(8) : diasMes;
  return { venta, recaudo, base, baseTxt: v.comBase === 'venta' ? 'venta facturada' : 'recaudo', pct, comision: Math.round(base * pct / 100), meta, avance: meta ? venta / meta * 100 : 0, esperado: meta ? diaHoy / diasMes * 100 : 0, proyeccion: diaHoy ? venta / diaHoy * diasMes : 0 };
}

function guardarCliente(cid, prId) {

// Encabezados reconocidos: NIT, Cliente (persona), Nombre Comercial (negocio), Dirección, Barrio, Teléfono/Celular, Municipio, Tipo.
// El negocio = Nombre Comercial; si está vacío, el nombre del cliente. No se repiten clientes con el mismo NIT o nombre.
let IMPC = null;
function importarClientes() {

  openModal('Importar clientes desde Excel', `

    <textarea id="icTxt" style="min-height:130px;margin-top:10px;font-family:monospace;font-size:12px" placeholder="Pega aquí…" oninput="icLeer()"></textarea>
    <div id="icPrev" style="margin-top:10px"></div>`, true);
  setTimeout(() => $('icTxt') && $('icTxt').focus(), 50);

function icLeer() {
  const lineas = $('icTxt').value.replace(/\r/g, '').split('\n').filter(l => l.trim()), out = $('icPrev'); IMPC.filas = [];
  if (!lineas.length) { out.innerHTML = ''; return; }
  const hi = lineas.findIndex(l => l.split('\t').some(c => ['cliente', 'nombrecomercial', 'nombre', 'negocio'].includes(normH(c))));
  if (hi < 0) { out.innerHTML = '<div class="alert bad">No encuentro la fila de títulos. Copia la tabla incluyendo los títulos (debe haber una columna "Cliente" o "Nombre Comercial").</div>'; return; }
  const H = lineas[hi].split('\t').map(normH), col = (...ks) => H.findIndex(h => ks.some(k => h === k || h.startsWith(k)));
  const ix = { nit: col('nit', 'cedula', 'documento'), cli: col('cliente', 'nombre', 'contacto'), com: col('nombrecomercial', 'negocio', 'razonsocial'), dir: col('direccion'), bar: col('barrio'), tel: col('telefono', 'celular', 'whatsapp'), mun: col('municipio', 'ciudad'), tipo: col('tipo') };
  if (ix.com === ix.cli) ix.com = -1;
  const existe = new Set(clientes().flatMap(c => [c.nit ? 'n:' + c.nit : null, 'x:' + c.nombre.toLowerCase()]).filter(Boolean)), vistos = new Set();
  const lim = t => String(t || '').replace(/\s+/g, ' ').trim(), sinB = t => lim(t).replace(/^(B\/|BARRIO|BRR)\s*/i, '');
  lineas.slice(hi + 1).forEach(l => {
    const c = l.split('\t'), g = k => ix[k] >= 0 ? lim(c[ix[k]]) : '';
    const persona = g('cli'), negocio = g('com') || persona; if (!negocio) return;
    const nit = g('nit').replace(/[^\dKk-]/g, ''), tel = g('tel').replace(/\D/g, '').slice(-10);
    const mun = MUNICIPIOS.find(m => m.toLowerCase() === g('mun').toLowerCase()) || $('icMun').value;
    const tipo = TIPOS_CLIENTE.find(t => t.toLowerCase() === g('tipo').toLowerCase()) || $('icTipo').value;
    const errs = [], k1 = nit ? 'n:' + nit : null, k2 = 'x:' + negocio.toLowerCase();
    if ((k1 && existe.has(k1)) || existe.has(k2)) errs.push('ya existe');
    else if ((k1 && vistos.has(k1)) || vistos.has(k2)) errs.push('repetido en la lista');
    if (tel && tel.length !== 10) errs.push('celular inválido');
    if (k1) vistos.add(k1); vistos.add(k2);
    IMPC.filas.push({ nombre: negocio, contacto: persona !== negocio ? persona : '', nit, tel: tel.length === 10 ? tel : '', barrio: sinB(g('dir') || g('bar')), municipio: mun, tipo, errs });
  });
  const ok = IMPC.filas.filter(f => !f.errs.length), mal = IMPC.filas.length - ok.length;
  out.innerHTML = `<div class="row" style="gap:6px;margin-bottom:8px"><span class="b ok">${ok.length} para importar</span>${mal ? `<span class="b bad">${mal} no se importan</span>` : ''}</div>
    <div class="tw" style="max-height:300px;overflow:auto"><table><thead><tr><th>Negocio</th><th>Contacto</th><th>NIT</th><th>Barrio / dirección</th><th>Cel.</th><th>Estado</th></tr></thead><tbody>
    ${IMPC.filas.map(f => `<tr><td>${esc(f.nombre)}</td><td>${esc(f.contacto) || '—'}</td><td>${esc(f.nit) || '—'}</td><td style="white-space:normal;min-width:200px">${esc(f.barrio)}</td><td>${f.tel || '—'}</td><td>${f.errs.length ? `<span class="b bad">${f.errs.join(', ')}</span>` : '<span class="b ok">OK</span>'}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="mfoot"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" ${ok.length ? '' : 'disabled'} onclick="icGuardar()">Importar ${ok.length} clientes</button></div>`;
}
function icGuardar() {
  const ok = IMPC.filas.filter(f => !f.errs.length); if (!ok.length) return;

/* ---------- RUTAS Y COBERTURA ---------- */
const FR = { fecha: '', ven: '', res: '' };
function vRutas() {
  const T = TODAY(), F = FR.fecha || T, dw = diaSemana(F), pasado = F < T;
  const vs = vendedores().filter(v => !FR.ven || v.id === FR.ven);
  const filas = [];
  const res = vs.map(v => {
    const prog = programados(v.id, F), progIds = new Set(prog.map(c => c.id)), vis = visitasDe(v.id, F);
    const ult = {}; vis.sort((a, b) => a.ts - b.ts).forEach(x => ult[x.clienteId] = x);
    prog.forEach(c => filas.push({ c, v, prog: true, vi: ult[c.id] }));
    Object.values(ult).filter(x => !progIds.has(x.clienteId)).forEach(x => filas.push({ c: C(x.clienteId), v, prog: false, vi: x }));
    const visitados = prog.filter(c => ult[c.id]).length, conPed = Object.values(ult).filter(x => x.resultado === 'pedido').length;
    const venta = sum(pedidos().filter(o => o.vendedorId === v.id && o.fecha === F && o.estado !== 'anulado' && o.estado !== 'rechazado'), o => o.total);
    return { v, prog: prog.length, visitados, conPed, total: Object.keys(ult).length, fuera: Object.values(ult).filter(x => !progIds.has(x.clienteId)).length, lejos: Object.values(ult).filter(x => x.dist > DIST_ALERTA).length, sinGps: Object.values(ult).filter(x => !x.gps).length, venta, primera: vis.length ? Math.min(...vis.map(x => x.ts)) : null, ultima: vis.length ? Math.max(...vis.map(x => x.ts)) : null };
  });
  const estado = f => f.vi ? f.vi.resultado : pasado ? 'novisitado' : 'pendiente';
  const lista = filas.filter(f => !FR.res || estado(f) === FR.res).sort((a, b) => (a.vi ? a.vi.ts : 9e15) - (b.vi ? b.vi.ts : 9e15));
  const rutero = vendedores().map(v => ({ v, d: [1, 2, 3, 4, 5, 6].map(d => clientes().filter(c => c.vendedorId === v.id && (c.dias || []).includes(d)).length) }));

  $('app').innerHTML = `
  <div class="row between"><h2>Rutas y cobertura</h2><div class="row">
    <input type="date" style="width:auto" value="${F}" onchange="FR.fecha=this.value;vRutas()">
    <select style="width:auto" onchange="FR.ven=this.value;vRutas()"><option value="">Todos los vendedores</option>${vendedores().map(v => `<option value="${v.id}" ${FR.ven === v.id ? 'selected' : ''}>${esc(v.nombre)}</option>`).join('')}</select></div></div>
  <p class="small mut" style="margin-top:-8px">${DIAS_L[dw][0].toUpperCase() + DIAS_L[dw].slice(1)} ${fFecha(F)}. Cobertura = clientes programados que fueron visitados. Efectividad = visitas que terminaron en pedido.</p>
  <div class="kpis">${res.map(r => `<div class="kpi"><div class="l">${esc(r.v.nombre)} · ${esc(r.v.zona)}</div>
    <div class="v">${r.visitados}/${r.prog} <span class="small mut">${r.prog ? Math.round(r.visitados / r.prog * 100) : 0}% cobertura</span></div>
    <div class="s">${r.conPed} con pedido · efectividad <b>${r.total ? Math.round(r.conPed / r.total * 100) : 0}%</b> · ${fmt(r.venta)}</div>
    <div class="s" style="margin-top:4px">${r.primera ? `🕗 ${fHora(r.primera)} – ${fHora(r.ultima)}` : 'Sin visitas'}${r.fuera ? ` · ${r.fuera} fuera de ruta` : ''}${r.lejos ? ` · <b style="color:var(--warn)">${r.lejos} lejos del negocio</b>` : ''}${r.sinGps ? ` · ${r.sinGps} sin GPS` : ''}</div></div>`).join('')}</div>
  <div class="tabs2">${[['', 'Todas'], ['pedido', 'Con pedido'], ['no_compro', 'No compró'], ['cerrado', 'Cerrado'], ['cobro', 'Solo cobro'], [pasado ? 'novisitado' : 'pendiente', pasado ? 'No visitados' : 'Pendientes']].map(([k, t]) => `<button class="${FR.res === k ? 'on' : ''}" onclick="FR.res='${k}';vRutas()">${t} (${k ? filas.filter(f => estado(f) === k).length : filas.length})</button>`).join('')}</div>
  <div class="tw"><table><thead><tr><th>Hora</th><th>Cliente</th><th>Vendedor</th><th>Ruta</th><th>Resultado</th><th>Detalle</th><th>GPS</th></tr></thead><tbody>
  ${lista.map(f => { const x = f.vi, o = x && x.pedidoId ? PED(x.pedidoId) : null; return `<tr class="clk" onclick="ficha('${f.c.id}','vis')"><td>${x ? fHora(x.ts) : '—'}</td><td><b>${esc(f.c.nombre)}</b><div class="small mut">${esc(f.c.barrio)}, ${esc(f.c.municipio)}</div></td><td>${esc(f.v.nombre)}</td><td>${f.prog ? 'Programado' : '<span class="b info">Fuera de ruta</span>'}</td><td>${x ? bRes(x.resultado) : pasado ? '<span class="b bad">No visitado</span>' : '<span class="b mut">Pendiente</span>'}</td><td class="small">${o ? fmt(o.total) + ' · ' + ESTADOS[o.estado][1] : esc(x ? x.motivo : '')}</td><td onclick="event.stopPropagation()">${x && x.gps ? `<a href="${mapaLink(x.gps)}" target="_blank" class="b ${x.dist > DIST_ALERTA ? 'warn' : 'ok'}" style="text-decoration:none">${x.dist != null ? fDist(x.dist) : 'ver'}</a>` : x ? '<span class="b mut">sin GPS</span>' : ''}</td></tr>`; }).join('') || '<tr><td colspan="7" class="mut">Sin registros para este filtro.</td></tr>'}
  </tbody></table></div>
  <div class="card" style="margin-top:14px"><h3>Rutero semanal (clientes por día)</h3>

    ${sinDia.length ? `<div class="alert warn">${sinDia.length} cliente(s) sin día de visita: ${sinDia.slice(0, 6).map(c => `<a href="#" onclick="event.preventDefault();formCliente('${c.id}')">${esc(c.nombre)}</a>`).join(', ')}${sinDia.length > 6 ? '…' : ''}</div>` : '<p class="small mut" style="margin-bottom:0">Los días de visita se editan en la ficha de cada cliente.</p>'}
  </div>`;
}

/* ---------- FINANZAS: CAJA, CUENTAS POR PAGAR, GASTOS Y RESULTADOS ---------- */
// Contabilidad gerencial (no es contabilidad para la DIAN).
// El dinero se calcula con:
//  · movimientos/{id} registrados a mano: aportes, gastos, pagos a proveedores y transportadoras, traslados, retiros
//  · ingresos automáticos: abonos confirmados de cartera, ventas de contado entregadas y faltantes/sobrantes de liquidaciones
// El flete de COMPRA ya va en el costo del producto: NO es gasto. Su pago sí sale de caja (pago_flete).
const CUENTAS_DEF = ['Efectivo', 'Nequi', 'Daviplata', 'Banco'];
const cuentas = () => (DB.config && DB.config.cuentas && DB.config.cuentas.length ? DB.config.cuentas : CUENTAS_DEF);
const cuentaDeMedio = m => { const cs = cuentas(); if (m === 'Transferencia') return cs.includes('Banco') ? 'Banco' : cs[0]; return cs.includes(m) ? m : cs[0]; };
const CAT_GASTO = ['Arriendo', 'Sueldo del dueño', 'Comisiones vendedores', 'Servicios (luz, agua, internet)', 'Transporte y despachos a clientes', 'Empaques y papelería', 'Mantenimiento', 'Impuestos y trámites', 'Otros gastos'];
const TIPO_MOV = {
  aporte: ['ok', 'Aporte de capital', 1], ingreso: ['ok', 'Otro ingreso', 1], recaudo: ['ok', 'Recaudo cartera', 1], venta_contado: ['ok', 'Venta de contado', 1],
  gasto: ['bad', 'Gasto', -1], pago_prov: ['warn', 'Pago a proveedor', -1], pago_flete: ['warn', 'Pago de flete', -1], retiro: ['bad', 'Retiro del dueño', -1],
  faltante: ['bad', 'Liquidación', 1], traslado: ['info', 'Traslado', 0]

const movs = () => vals(DB.movimientos);
const tsDe = f => Date.parse(f + 'T12:00:00');

// Estado de pago de una compra. Compras viejas (sin condición) quedan por pagar desde su fecha.
function compraInfo(c) {
  if (c.anulada) return { merc: 0, flete: 0, modo: null, totalProv: 0, totalFlete: 0, pagadoProv: 0, pagadoFlete: 0, saldoProv: 0, saldoFlete: 0, vence: c.vence || c.fecha, condicion: 'anulada' };
  const merc = Math.round(sum(c.lineas || [], l => l.cant * (l.costoFactura != null ? l.costoFactura : l.costo)));   // pesos enteros (costos con decimales)
  const flete = +c.flete || 0, modo = flete ? (c.fleteModo || 'transportadora') : null;
  const totalProv = merc + (modo === 'proveedor' ? flete : 0), totalFlete = modo === 'transportadora' ? flete : 0;
  const pag = t => sum(movs().filter(m => m.tipo === t && m.compraId === c.id), m => m.valor);
  const pagadoProv = pag('pago_prov'), pagadoFlete = pag('pago_flete');
  return { merc, flete, modo, totalProv, totalFlete, pagadoProv, pagadoFlete, saldoProv: Math.max(0, Math.round(totalProv - pagadoProv)), saldoFlete: Math.max(0, Math.round(totalFlete - pagadoFlete)), vence: c.vence || c.fecha, condicion: c.condicion || 'sin dato' };
}

// Todos los movimientos de dinero (manuales + automáticos), en orden cronológico, con signo.
function movimientosCaja() {
  const out = [];
  movs().forEach(m => {
    if (m.tipo === 'traslado') {
      out.push({ ...m, monto: -m.valor, txt: 'Traslado a ' + m.destino + (m.desc ? ' · ' + m.desc : '') });
      out.push({ ...m, id: m.id + 'd', cuenta: m.destino, monto: m.valor, txt: 'Traslado desde ' + m.cuenta + (m.desc ? ' · ' + m.desc : ''), espejo: true });
      return;
    }
    const t = TIPO_MOV[m.tipo] || ['mut', m.tipo, 0];
    out.push({ ...m, monto: t[2] * m.valor, txt: (m.tipo === 'gasto' ? m.categoria + (m.desc ? ' · ' + m.desc : '') : m.desc || t[1]) });
  });
  pedidos().forEach(o => {
    if (o.estado === 'anulado') return;

// Estado de resultados de un mes (ventas facturadas − costo de lo vendido − gastos)
function resultadosMes(mes) {
  const ps = pedidos().filter(o => VALIDOS.includes(o.estado) && o.fecha.startsWith(mes));
  const ventas = sum(ps, o => o.total);
  const costo = sum(ps, o => sum(lineasDe(o), l => l.cant * (l.costo != null ? l.costo : (P(l.pid) ? P(l.pid).costo : 0))));
  const gastos = movs().filter(m => m.tipo === 'gasto' && m.fecha.startsWith(mes)), porCat = {};
  gastos.forEach(m => porCat[m.categoria] = (porCat[m.categoria] || 0) + m.valor);
  const totGastos = sum(gastos, m => m.valor), bruta = ventas - costo;

  return { ventas, costo, bruta, porCat, totGastos, neta: bruta - totGastos, n: ps.length, compras, comis };
}

function guardarProveedor(id) {

/* ---------- CORRECCIONES: anular compra, reversar abono, ajustar inventario ---------- */
async function anularCompra(cid) {
  const c = DB.compras[cid]; if (!c || c.anulada) return;
  const sale = {}; (c.lineas || []).forEach(l => sale[l.pid] = (sale[l.pid] || 0) + l.cant);
  const falta = Object.entries(sale).filter(([pid, q]) => P(pid) && P(pid).stock < q);
  if (falta.length) return alert('No se puede anular ' + cid + ': parte de esa mercancía ya se vendió.\n\n' + falta.map(([pid, q]) => `${P(pid).nombre}: entraron ${q}, hay ${P(pid).stock}`).join('\n') + '\n\nCorrige con "Ajustar stock" en el producto.');
  const pagos = movs().filter(m => m.compraId === cid), totPag = sum(pagos, m => m.valor);
  const mot = prompt(`Anular ${cid} de ${c.proveedor} por ${fmt(c.total)}.\n\nSe descuentan las unidades del inventario${pagos.length ? `, y los pagos registrados (${fmt(totPag)}) se borran y la plata vuelve a su cuenta` : ''}.\n\nEscribe el motivo:`);
  if (!mot) return;
  const upd = { [`compras/${cid}/anulada`]: true, [`compras/${cid}/anuladaTs`]: Date.now(), [`compras/${cid}/motivo`]: mot };
  for (const pid in sale) if (P(pid)) upd[`productos/${pid}/stock`] = P(pid).stock - sale[pid];
  (c.lineas || []).forEach(l => { if (P(l.pid) && l.costoAnt != null && P(l.pid).costo === l.costo) upd[`productos/${l.pid}/costo`] = l.costoAnt; });
  pagos.forEach(m => upd['movimientos/' + m.id] = null);
  guardar(upd); toast('Compra ' + cid + ' anulada'); render(); historialCompras();
}

  openModal('Recibir liquidación · ' + V(l.vendedorId).nombre, `
    <div class="small mut" style="margin-bottom:8px">Enviada ${fFecha(l.fecha)} ${fHora(l.ts)}</div>
    <div class="tw"><table><thead><tr><th>Cliente</th><th>Factura</th><th>Medio</th><th class="n">Valor</th><th class="n">Saldo factura</th></tr></thead><tbody>${l.items.map(it => { const o = PED(it.pid), ok = o && o.abonos && o.abonos[it.aid]; return `<tr><td>${o ? esc(C(o.clienteId).nombre) : '—'}</td><td>${o && o.factura ? o.factura.num : '—'}</td><td>${it.medio}</td><td class="n">${fmt(it.valor)}</td><td class="n">${ok ? fmt(saldoPedido(o)) : '<span class="b bad">abono borrado</span>'}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="fg" style="margin-top:12px">
      ${Object.entries(l.totales).map(([m, v]) => `<label>${m}${m === 'Efectivo' ? ' esperado' : ''}<input value="${fmt(v)}" disabled></label>`).join('')}
      <label>Efectivo recibido en oficina<input id="lqEf" type="number" min="0" value="${ef}" oninput="$('lqDif').textContent=(${ef}-(+this.value||0))?'Diferencia: '+fmt(${ef}-(+this.value||0)):'Cuadra ✓'"></label>
    </div>
    <div class="small" id="lqDif" style="margin-top:6px;font-weight:700">Cuadra ✓</div>
    <label class="f" style="margin-top:8px">Nota (opcional)<input id="lqNota" placeholder="Ej: Nequi verificado en la app del banco"></label>
    <div class="alert info">Al recibir, todos los abonos quedan confirmados y bajan el saldo de cada factura. Verifica antes los pagos digitales.</div>
    <div class="mfoot"><button class="btn bad" onclick="devolverLiq('${id}')">Devolver al vendedor</button><button class="btn ok" onclick="confirmarLiq('${id}')">✓ Recibir y confirmar</button></div>`, true);
}
function confirmarLiq(id) {
  const l = DB.liquidaciones[id], rec = +$('lqEf').value || 0, dif = (l.totales.Efectivo || 0) - rec;
  if (dif && !confirm(`Hay una diferencia de ${fmt(dif)} en efectivo. ¿Recibir igual y dejarla registrada?`)) return;
  const upd = { [`liquidaciones/${id}/estado`]: 'recibida', [`liquidaciones/${id}/efectivoRecibido`]: rec, [`liquidaciones/${id}/diferencia`]: dif, [`liquidaciones/${id}/nota`]: $('lqNota').value.trim(), [`liquidaciones/${id}/recibidaTs`]: Date.now() };
  const saldo = {}, omitidos = [];
  l.items.forEach(it => {
    const o = PED(it.pid); if (!o || !o.abonos || !o.abonos[it.aid]) return;
    if (saldo[o.id] == null) saldo[o.id] = saldoPedido(o);
    if (it.valor > saldo[o.id]) { omitidos.push(o.factura.num); return; }
    saldo[o.id] -= it.valor;
    upd[`pedidos/${o.id}/abonos/${it.aid}/confirmado`] = true; upd[`pedidos/${o.id}/abonos/${it.aid}/confirmadoTs`] = Date.now();
  });
  guardar(upd); closeModal(); render();
  toast(omitidos.length ? `Recibida. Revisa ${omitidos.join(', ')}: el abono supera el saldo` : 'Liquidación recibida · abonos confirmados');
}
function devolverLiq(id) {
  const mot = prompt('Motivo de la devolución (lo verá el vendedor):'); if (!mot) return;
  const l = DB.liquidaciones[id], upd = { [`liquidaciones/${id}/estado`]: 'rechazada', [`liquidaciones/${id}/nota`]: mot };
  l.items.forEach(it => { if (PED(it.pid) && PED(it.pid).abonos && PED(it.pid).abonos[it.aid]) upd[`pedidos/${it.pid}/abonos/${it.aid}/liqId`] = null; });
  guardar(upd); closeModal(); render(); toast('Liquidación devuelta');
}
function formAbono(id) {
  const o = PED(id), s = saldoPedido(o);
  openModal('Registrar abono · ' + o.factura.num, `
    <div class="small mut" style="margin-bottom:10px">${esc(C(o.clienteId).nombre)} · Saldo <b>${fmt(s)}</b></div>
    <div class="fg"><label>Valor<input id="abVal" type="number" min="1" max="${s}" value="${s}"></label><label>Medio de pago<select id="abMed">${MEDIOS_PAGO.map(m => `<option>${m}</option>`).join('')}</select></label><label>Fecha<input id="abFec" type="date" value="${TODAY()}"></label></div>
    <div class="mfoot"><button class="btn sec" onclick="verPedido('${id}')">Cancelar</button><button class="btn" onclick="guardarAbono('${id}')">Guardar abono</button></div>`);
}
function guardarAbono(id) {
  const o = PED(id), s = saldoPedido(o), v = Math.round(+$('abVal').value);
  if (!(v > 0)) return toast('Valor inválido');
  if (v > s) return toast('El abono no puede superar el saldo (' + fmt(s) + ')');
  const aid = uid('A');
  guardar({ [`pedidos/${id}/abonos/${aid}`]: { id: aid, fecha: $('abFec').value || TODAY(), ts: Date.now(), valor: v, medio: $('abMed').value, confirmado: true } });
  render(); verPedido(id); toast(v === s ? 'Factura pagada ✓' : 'Abono registrado');
}

/* ---------- EQUIPO Y AJUSTES ---------- */
function vEquipo() {
  const T = TODAY(), mes = T.slice(0, 7);
  const filas = vendedores().map(v => {
    const ps = pedidos().filter(o => o.vendedorId === v.id), mesV = ps.filter(o => VALIDOS.includes(o.estado) && o.fecha.startsWith(mes));
    const cls = clientes().filter(c => c.vendedorId === v.id);
    const rech = ps.filter(o => o.estado === 'rechazado' && o.fecha.startsWith(mes)).length;
    const rec = sum(ps.flatMap(o => abonos(o).filter(a => a.confirmado && a.fecha.startsWith(mes))), a => a.valor);
    return { v, cm: comisionVendedor(v.id, mes), ventas: sum(mesV, o => o.total), n: mesV.length, cls: cls.length, activos: cls.filter(c => estadoCliente(c).k === 'ok').length, cartera: sum(cls, c => saldoCliente(c.id)), venc: sum(cls, c => sum(vencidasCliente(c.id), saldoPedido)), rech, rec };
  });
  $('app').innerHTML = `
  <div class="row between"><h2>Equipo de ventas</h2><button class="btn" onclick="formVendedor()">+ Vendedor</button></div>
  <div class="tw" style="margin-bottom:16px"><table><thead><tr><th>Vendedor</th><th>Usuario</th><th class="n">Ventas mes</th><th class="n">Meta</th><th>Avance</th><th class="n">Pedidos</th><th class="n">Clientes</th><th class="n">Cartera</th><th class="n">Vencida</th><th class="n">Recaudo mes</th><th class="n">Comisión</th></tr></thead><tbody>
  ${filas.map(f => `<tr class="clk" onclick="formVendedor('${f.v.id}')"><td><b>${esc(f.v.nombre)}</b><div class="small mut">${esc(f.v.zona)}${f.v.activo === false ? ' · <span style="color:var(--bad)">inactivo</span>' : ''}</div></td><td>${esc(f.v.usuario)}</td><td class="n"><b>${fmt(f.ventas)}</b></td><td class="n">${f.cm.meta ? fmt(f.cm.meta) : '—'}</td><td style="min-width:130px">${f.cm.meta ? `<div style="height:10px;background:#f1ecef;border-radius:6px;overflow:hidden;position:relative"><div style="height:100%;width:${Math.min(100, f.cm.avance).toFixed(0)}%;background:${f.cm.avance >= f.cm.esperado ? 'var(--ok)' : 'var(--acc)'}"></div><div style="position:absolute;top:0;bottom:0;left:${Math.min(100, f.cm.esperado).toFixed(0)}%;width:2px;background:var(--pri)"></div></div><div class="small mut">${f.cm.avance.toFixed(0)}% · proy. ${fmtK(f.cm.proyeccion)}</div>` : '—'}</td><td class="n">${f.n}${f.rech ? `<div class="small" style="color:var(--bad)">${f.rech} rech.</div>` : ''}</td><td class="n">${f.activos}/${f.cls}</td><td class="n">${fmt(f.cartera)}</td><td class="n" style="color:var(--bad)">${fmt(f.venc)}</td><td class="n">${fmt(f.cm.recaudo)}</td><td class="n"><b>${fmt(f.cm.comision)}</b><div class="small mut">${f.cm.pct}% s/ ${f.cm.baseTxt}</div></td></tr>`).join('')}
  <tr style="background:#faf7f9;font-weight:700"><td colspan="2">Total</td><td class="n">${fmt(sum(filas, f => f.ventas))}</td><td class="n">${fmt(sum(filas, f => f.cm.meta))}</td><td></td><td class="n">${sum(filas, f => f.n)}</td><td></td><td class="n">${fmt(sum(filas, f => f.cartera))}</td><td class="n">${fmt(sum(filas, f => f.venc))}</td><td class="n">${fmt(sum(filas, f => f.cm.recaudo))}</td><td class="n">${fmt(sum(filas, f => f.cm.comision))}</td></tr>
  </tbody></table></div>
  <div class="grid2">
    <div class="card"><h3>Acceso administración</h3>
      <div class="fg"><label>Usuario<input id="cfU" value="${esc(DB.config.admin.usuario)}"></label><label>Clave nueva<input id="cfC" type="password" placeholder="Dejar vacío para no cambiar"></label></div>
      <label class="f" style="margin-top:10px">Cuentas de dinero (separadas por coma)<input id="cfCtas" value="${esc(cuentas().join(', '))}"></label>
      <label class="f" style="margin-top:10px">Descuento máximo que puede dar el vendedor<select id="cfD">${[0, 2, 3, 5, 8, 10].map(d => `<option value="${d}" ${(DB.config.descMaxVendedor || 0) === d ? 'selected' : ''}>${d}%</option>`).join('')}</select></label>
      <div class="mfoot"><button class="btn" onclick="guardarConfig()">Guardar ajustes</button></div></div>
    <div class="card"><h3>Empresa</h3>
      <div class="row" style="gap:12px;margin-bottom:10px">${(DB.config.empresa || {}).logo ? `<img src="${(DB.config.empresa || {}).logo}" style="width:72px;height:72px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#fff">` : '<div class="ph" style="width:72px;height:72px;font-size:13px;text-align:center">Sin logo</div>'}
        <div class="row" style="gap:6px"><label class="btn sm acc btnfile">🖼 ${(DB.config.empresa || {}).logo ? 'Cambiar logo' : 'Subir logo'}<input type="file" accept="image/*" onchange="subirLogo(this)"></label>${(DB.config.empresa || {}).logo ? '<button class="btn sm sec" onclick="quitarLogo()">Quitar</button>' : ''}</div></div>
      <div class="fg"><label>Nombre de la empresa<input id="cfEN" value="${esc((DB.config.empresa || {}).nombre || EMPRESA)}" oninput="$('cfEI').placeholder = inicialesDe(this.value)"></label><label>Iniciales del logo<input id="cfEI" maxlength="3" value="${esc((DB.config.empresa || {}).iniciales || '')}" placeholder="${esc(inicialesDe(EMPRESA))}"></label></div>
      <label class="f" style="margin-top:10px">Frase (página de inicio)<input id="cfEL" value="${esc((DB.config.empresa || {}).lema || '')}" placeholder="Distribuidora capilar · Canal TAT Chocó"></label>
      <div class="fg" style="margin-top:10px"><label>NIT o cédula<input id="cfED" value="${esc((DB.config.empresa || {}).doc || '')}" placeholder="Ej: CC 1.077.000.000"></label><label>Teléfono / WhatsApp<input id="cfET" value="${esc((DB.config.empresa || {}).tel || '')}"></label></div>
      <label class="f" style="margin-top:10px">Dirección<input id="cfEA" value="${esc((DB.config.empresa || {}).dir || '')}" placeholder="Ej: Cra 4 # 25-10, Quibdó"></label>
      <p class="small mut">Aparece en el encabezado, documentos de venta, remisiones, planillas y mensajes de WhatsApp. Para el logo usa solo el ícono (cuadrado, sin texto): el nombre ya se escribe al lado.</p>
      <div class="mfoot"><button class="btn" onclick="guardarEmpresa()">Guardar empresa</button></div></div>
    <div class="card"><h3>Datos</h3>
      <p class="small">Modo actual: <b>${MODO === 'local' ? 'Demo local (solo este navegador)' : 'Firebase · en la nube'}</b></p>
      <div class="row"><button class="btn sec" onclick="respaldo()">⬇ Descargar copia de seguridad</button></div>
      <div class="row" style="margin-top:10px">${DEMO ? '<button class="btn sec" onclick="cargarDemo()">Cargar datos de demostración</button>' : ''}<button class="btn bad" onclick="enBlanco()">Empezar en blanco</button></div>
      <p class="small mut">Ambas opciones reemplazan TODOS los datos actuales. Descarga una copia antes.</p></div>
  </div>`;
}
function formVendedor(id) {
  const v = id ? V(id) : { nombre: '', zona: '', usuario: '', clave: '', activo: true };
  openModal(id ? 'Editar vendedor' : 'Nuevo vendedor', `
    <div class="fg"><label>Nombre<input id="fvN" value="${esc(v.nombre)}"></label><label>Zona / ruta<input id="fvZ" value="${esc(v.zona)}"></label>
    <label>Usuario (para entrar a la app)<input id="fvU" value="${esc(v.usuario)}" autocapitalize="off"></label><label>Clave<input id="fvC" value="${esc(v.clave)}"></label>
    <label>Meta de venta mensual<input id="fvM" type="number" min="0" step="100000" value="${v.metaMes || 0}"></label>
    <label>Comisión %<input id="fvP" type="number" min="0" max="20" step="0.1" value="${v.comPct || 0}"></label>
    <label>Comisión sobre<select id="fvB"><option value="recaudo" ${v.comBase !== 'venta' ? 'selected' : ''}>Recaudo (recomendado)</option><option value="venta" ${v.comBase === 'venta' ? 'selected' : ''}>Venta facturada</option></select></label>
    <label>Estado<select id="fvA"><option value="1" ${v.activo !== false ? 'selected' : ''}>Activo</option><option value="0" ${v.activo === false ? 'selected' : ''}>Inactivo (no puede entrar)</option></select></label></div>
    <div class="mfoot"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" onclick="guardarVendedor('${id || ''}')">Guardar</button></div>`);
}
function guardarVendedor(id) {
  const d = { nombre: $('fvN').value.trim(), zona: $('fvZ').value.trim(), usuario: $('fvU').value.trim().toLowerCase(), clave: $('fvC').value, activo: $('fvA').value === '1', metaMes: +$('fvM').value || 0, comPct: +$('fvP').value || 0, comBase: $('fvB').value };
  if (!d.nombre || !d.usuario || !d.clave) return toast('Nombre, usuario y clave son obligatorios');
  if (vendedores().some(x => x.usuario === d.usuario && x.id !== id)) return toast('Ese usuario ya existe');
  const nid = id || 'V' + (Math.max(0, ...vendedores().map(x => parseInt(x.id.slice(1), 10) || 0)) + 1);
  guardar({ ['vendedores/' + nid]: { id: nid, ...d } }); closeModal(); render(); toast('Vendedor guardado');
}
async function subirLogo(input) {
  const file = input.files && input.files[0]; if (!file) return;
  if (!/^image\//.test(file.type)) return toast('El archivo no es una imagen');
  try { const data = await comprimirImagen(file, 320, 0.88); guardar({ 'config/empresa/logo': data }); aplicarMarca(); render(); toast('✅ Logo guardado'); }
  catch (e) { toast(e.message || 'No se pudo leer la imagen'); }
}
function quitarLogo() { if (!confirm('¿Quitar el logo?')) return; guardar({ 'config/empresa/logo': null }); aplicarMarca(); render(); }
const logoDoc = (px) => { const e = DB.config.empresa || {}; return e.logo ? `<img src="${e.logo}" style="width:${px}px;height:${px}px;object-fit:contain">` : ''; };
function guardarEmpresa() {
  const e = { nombre: $('cfEN').value.trim(), iniciales: $('cfEI').value.trim().toUpperCase(), lema: $('cfEL').value.trim(), doc: $('cfED').value.trim(), tel: $('cfET').value.trim(), dir: $('cfEA').value.trim() };
  if (!e.nombre) return toast('Escribe el nombre de la empresa');
  const upd = {}; for (const k in e) upd['config/empresa/' + k] = e[k];
  guardar(upd); aplicarMarca(); render(); toast('Empresa guardada');
}
function guardarConfig() {
  const upd = { 'config/admin/usuario': $('cfU').value.trim() || 'admin', 'config/descMaxVendedor': +$('cfD').value };
  const ctas = [...new Set($('cfCtas').value.split(',').map(x => x.trim()).filter(Boolean))];
  if (!ctas.length) return toast('Debe haber al menos una cuenta de dinero');
  const usadas = [...new Set(movs().flatMap(m => [m.cuenta, m.destino]).filter(Boolean))].filter(c => !ctas.includes(c));
  if (usadas.length) return toast('No puedes quitar ' + usadas.join(', ') + ': tiene movimientos registrados');
  upd['config/cuentas'] = ctas;
  if ($('cfC').value) { if ($('cfC').value.length < 6) return toast('La clave debe tener al menos 6 caracteres'); upd['config/admin/clave'] = $('cfC').value; }
  guardar(upd); render(); toast('Ajustes guardados');
}
function respaldo() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' }));
  a.download = 'respaldo_distribuidora_' + TODAY() + '.json'; a.click();
}
async function cargarDemo() { if (!confirm('Se reemplazarán TODOS los datos por datos de demostración. ¿Continuar?')) return; try { await reemplazarTodo(seed()); toast('Datos de demo cargados'); } catch (e) { toast(e.message); } }
async function enBlanco() {
  if (prompt('Esto borra clientes, pedidos, inventario y cartera. Escribe BORRAR para confirmar:') !== 'BORRAR') return;
  try { await reemplazarTodo(datosVacios()); toast('Sistema en blanco. Crea tus productos, vendedores y clientes.'); } catch (e) { toast(e.message); }
}
</script>
